<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="Fenêtre de code Java Spring Boot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5d3b"/>
      <stop offset="1" stop-color="#0a2e22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ec486"/>
      <stop offset="1" stop-color="#f2b705"/>
    </linearGradient>
  </defs>

  <rect width="560" height="420" rx="18" fill="url(#bg)"/>
  <circle cx="470" cy="70" r="110" fill="#3ec486" opacity=".12"/>
  <circle cx="70" cy="360" r="90" fill="#f2b705" opacity=".10"/>

  <!-- code window -->
  <g>
    <rect x="48" y="62" width="404" height="280" rx="12" fill="#0d1713" stroke="#2b3f36"/>
    <rect x="48" y="62" width="404" height="36" rx="12" fill="#16241d"/>
    <rect x="48" y="86" width="404" height="12" fill="#16241d"/>
    <circle cx="70" cy="80" r="6" fill="#ff5f56"/>
    <circle cx="90" cy="80" r="6" fill="#ffbd2e"/>
    <circle cx="110" cy="80" r="6" fill="#27c93f"/>
    <text x="150" y="85" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8aa396">StockController.java</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">
      <text x="68" y="128" fill="#f2b705">@RestController</text>
      <text x="68" y="152" fill="#f2b705">@RequestMapping<tspan fill="#e8efeb">(</tspan><tspan fill="#3ec486">"/api/stock"</tspan><tspan fill="#e8efeb">)</tspan></text>
      <text x="68" y="176"><tspan fill="#c792ea">public class </tspan><tspan fill="#82aaff">StockController</tspan><tspan fill="#e8efeb"> {</tspan></text>
      <text x="92" y="212" fill="#f2b705">@GetMapping</text>
      <text x="92" y="236"><tspan fill="#c792ea">public </tspan><tspan fill="#82aaff">List</tspan><tspan fill="#e8efeb">&lt;</tspan><tspan fill="#82aaff">Produit</tspan><tspan fill="#e8efeb">&gt; </tspan><tspan fill="#e8efeb">tous() {</tspan></text>
      <text x="116" y="260"><tspan fill="#c792ea">return </tspan><tspan fill="#e8efeb">service.findAll();</tspan></text>
      <text x="92" y="284" fill="#e8efeb">}</text>
      <text x="68" y="308" fill="#e8efeb">}</text>
    </g>
    <rect x="68" y="322" width="9" height="3" fill="#3ec486"/>
  </g>

  <!-- floating chips -->
  <g font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(372 44)">
      <rect width="120" height="34" rx="17" fill="#e8efeb"/>
      <circle cx="18" cy="17" r="6" fill="#3ec486"/>
      <text x="32" y="22" fill="#0a2e22">Spring Boot</text>
    </g>
    <g transform="translate(398 300)">
      <rect width="104" height="34" rx="17" fill="#e8efeb"/>
      <circle cx="18" cy="17" r="6" fill="#2496ed"/>
      <text x="32" y="22" fill="#0a2e22">Docker</text>
    </g>
    <g transform="translate(24 316)">
      <rect width="96" height="34" rx="17" fill="#e8efeb"/>
      <circle cx="18" cy="17" r="6" fill="#f2b705"/>
      <text x="32" y="22" fill="#0a2e22">MySQL</text>
    </g>
  </g>

  <rect x="48" y="372" width="140" height="5" rx="2.5" fill="url(#glow)"/>
  <text x="48" y="402" font-family="system-ui, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#cfe3d9">Amdy Tech · Java et web</text>
</svg>
